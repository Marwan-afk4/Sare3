<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User-Driver Chat Debugger | Sarea</title>
    <!-- Pusher and Echo CDNs -->
    <script src="https://cdn.jsdelivr.net/npm/pusher-js@8.3.0/dist/web/pusher.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/laravel-echo@1.16.1/dist/echo.iife.js"></script>
    <!-- Fonts and Styles -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(17, 24, 39, 0.7);
            --accent-color: #f59e0b; /* Amber/orange color for Sarea theme */
            --accent-color-hover: #d97706;
            --success-color: #10b981;
            --error-color: #ef4444;
            --info-color: #3b82f6;
            --text-color: #f3f4f6;
            --text-dim: #9ca3af;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            background-image: 
                radial-gradient(at 0% 0%, rgba(245, 158, 11, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(59, 130, 246, 0.12) 0px, transparent 50%);
        }

        header {
            padding: 1.25rem 2rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(12px);
            background: rgba(11, 15, 25, 0.85);
            z-index: 10;
        }

        header h1 {
            font-size: 1.2rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        header h1 span {
            color: var(--accent-color);
        }

        .status-badge {
            font-size: 0.75rem;
            padding: 0.3rem 0.8rem;
            border-radius: 9999px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-dim);
        }

        .status-badge .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #6b7280;
        }

        .status-badge.connected .dot { background: var(--success-color); box-shadow: 0 0 8px var(--success-color); }
        .status-badge.connecting .dot { background: #fbbf24; animation: pulse 1s infinite; }
        .status-badge.error .dot { background: var(--error-color); }

        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }

        main {
            display: grid;
            grid-template-columns: 380px 1fr;
            flex: 1;
            overflow: hidden;
            gap: 1rem;
            padding: 1rem;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            overflow-y: auto;
            padding-right: 0.25rem;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.25rem;
            backdrop-filter: blur(10px);
        }

        .card h2 {
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 0.85rem;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.4rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .form-group {
            margin-bottom: 0.75rem;
        }

        label {
            display: block;
            font-size: 0.65rem;
            margin-bottom: 0.25rem;
            color: var(--text-dim);
            font-weight: 600;
            text-transform: uppercase;
        }

        input, select {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            color: white;
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.8rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent-color);
        }

        button {
            width: 100%;
            background: var(--accent-color);
            color: #0b0f19;
            border: none;
            padding: 0.6rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--accent-color-hover);
        }

        button.outline {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
        }

        button.outline:hover {
            background: rgba(255, 255, 255, 0.03);
            border-color: var(--text-dim);
        }

        .log-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--border-color);
            border-radius: 12px;
        }

        .log-header {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.1);
        }

        .logs {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .log-entry {
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
            border-left: 3px solid transparent;
            background: rgba(255, 255, 255, 0.01);
            animation: slideIn 0.2s ease-out;
        }

        @keyframes slideIn { 
            from { opacity: 0; transform: translateX(10px); } 
            to { opacity: 1; transform: translateX(0); } 
        }

        .log-entry.info { border-color: var(--info-color); }
        .log-entry.success { border-color: var(--success-color); color: #a7f3d0; }
        .log-entry.error { border-color: var(--error-color); color: #fca5a5; }
        .log-entry.event-chat { border-color: #fbbf24; }
        .log-entry.event-seen { border-color: #60a5fa; }
        .log-entry.event-presence { border-color: #a78bfa; }

        .log-time {
            color: var(--text-dim);
            margin-right: 0.5rem;
            font-weight: bold;
        }

        .log-label {
            font-weight: 600;
        }

        pre { 
            background: rgba(0, 0, 0, 0.4); 
            padding: 0.5rem; 
            border-radius: 4px; 
            margin-top: 0.5rem; 
            overflow-x: auto; 
            color: #d1d5db; 
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .highlight-box { 
            background: rgba(245, 158, 11, 0.05); 
            padding: 0.6rem; 
            border-radius: 6px; 
            margin-bottom: 0.5rem; 
            font-size: 0.75rem; 
            color: var(--accent-color); 
            text-align: center; 
            border: 1px dashed rgba(245, 158, 11, 0.3); 
            font-weight: 600;
        }

        .btn-row { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 0.5rem; 
            margin-top: 0.5rem; 
        }
    </style>
</head>
<body>
    <header>
        <h1>Sarea <span>WebSocket Chat Debugger</span></h1>
        <div id="connectionStatus" class="status-badge">
            <div class="dot"></div>
            <span>Disconnected</span>
        </div>
    </header>

    <main>
        <div class="sidebar">
            <div class="card">
                <h2>1. Reverb Server Configuration</h2>
                <div class="form-row">
                    <input type="text" id="reverbHost" placeholder="Host">
                    <input type="number" id="reverbPort" value="8085" placeholder="Port">
                </div>
                <button id="connectBtn">Connect WebSocket</button>
            </div>

            <div class="card">
                <h2>2. Authentication</h2>
                <div class="form-group">
                    <label>Sanctum Bearer Token</label>
                    <input type="password" id="authToken" placeholder="Paste user token (e.g. 1|xxxx...)">
                </div>
            </div>

            <div class="card">
                <h2>3. Room Parameters</h2>
                <div class="form-group">
                    <label>Self Role (Role of Token User)</label>
                    <select id="selfRole">
                        <option value="user">Passenger (User)</option>
                        <option value="driver">Driver</option>
                    </select>
                </div>
                <div class="form-row">
                    <div class="form-group" style="margin-bottom:0;">
                        <label>User (Passenger) ID</label>
                        <input type="number" id="userId" value="5">
                    </div>
                    <div class="form-group" style="margin-bottom:0;">
                        <label>Driver ID</label>
                        <input type="number" id="driverId" value="12">
                    </div>
                </div>
                <div id="channelDisplay" class="highlight-box" style="margin-top:0.75rem;">presence-chat.5_12</div>
                <div class="form-group" style="display: flex; align-items: center; gap: 0.5rem; margin-top: 0.5rem;">
                    <input type="checkbox" id="typingToggle" style="width: auto;">
                    <label style="margin-bottom: 0;">Simulate Typing...</label>
                </div>
                <div class="btn-row">
                    <button id="subscribeBtn" class="outline">Subscribe Chat</button>
                    <button id="leaveBtn" class="outline" style="color: var(--error-color); border-color: rgba(239, 68, 68, 0.4);">Leave Room</button>
                </div>
            </div>

            <div class="card">
                <h2>4. Call HTTP APIs</h2>
                <div class="form-group">
                    <label>Test Message Body</label>
                    <input type="text" id="testMessage" value="Hello! This is a WebSocket test message.">
                </div>
                <div class="btn-row">
                    <button id="sendBtn" class="outline" style="color: var(--success-color); border-color: rgba(16, 185, 129, 0.4);">Send API</button>
                    <button id="readBtn" class="outline" style="color: #60a5fa; border-color: rgba(96, 165, 250, 0.4);">Read API</button>
                </div>
                <button id="historyBtn" class="outline" style="margin-top: 0.5rem; color: #a78bfa; border-color: rgba(167, 139, 250, 0.4);">Get History API</button>
            </div>
        </div>

        <div class="log-container">
            <div class="log-header">
                <h3>Live Console Feed</h3>
                <button id="clearLogs" class="outline" style="width: auto; padding: 0.2rem 0.5rem; font-size: 0.7rem;">Clear Feed</button>
            </div>
            <div id="logs" class="logs"></div>
        </div>
    </main>

    <script>
        const $ = id => document.getElementById(id);
        const lContainer = $('logs');
        $('reverbHost').value = window.location.hostname;
        
        // Auto-detect production HTTPS and set port to 443
        if (window.location.protocol === 'https:') {
            $('reverbPort').value = 443;
        }

        // Auto-update the visual channel representation based on the user & driver IDs
        const updateChannelDisplay = () => {
            const userId = parseInt($('userId').value) || 0;
            const driverId = parseInt($('driverId').value) || 0;
            $('channelDisplay').textContent = `presence-chat.${userId}_${driverId}`;
        };
        $('userId').oninput = updateChannelDisplay;
        $('driverId').oninput = updateChannelDisplay;

        function addLog(type, label, data = null) {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            const time = new Date().toLocaleTimeString();
            entry.innerHTML = `<span class="log-time">${time}</span><span class="log-label">${label}</span>`;
            if (data) {
                const pre = document.createElement('pre');
                pre.textContent = typeof data === 'string' ? data : JSON.stringify(data, null, 2);
                entry.appendChild(pre);
            }
            lContainer.appendChild(entry);
            lContainer.scrollTop = lContainer.scrollHeight;
        }

        let echo = null;
        let currentChannel = null;

        $('connectBtn').onclick = () => {
            if (echo) {
                echo.disconnect();
                addLog('info', 'Disconnected existing socket connection.');
            }
            
            const token = $('authToken').value.trim();
            if (!token) {
                alert('Please enter a Sanctum Bearer Token first!');
                return;
            }

            try {
                const EchoConstructor = window.Echo || window.LaravelEcho;
                echo = new EchoConstructor({
                    broadcaster: 'reverb',
                    key: '2eqkhunwlke2ea0t5oaz',
                    wsHost: $('reverbHost').value,
                    wsPort: parseInt($('reverbPort').value),
                    forceTLS: (window.location.protocol === 'https:'),
                    enabledTransports: ['ws', 'wss'],
                    authEndpoint: '/api/broadcasting/auth',
                    auth: {
                        headers: {
                            'Authorization': token.startsWith('Bearer ') ? token : 'Bearer ' + token,
                            'Accept': 'application/json'
                        }
                    }
                });

                echo.connector.pusher.connection.bind('state_change', (state) => {
                    addLog('info', 'Socket state change: ' + state.current);
                    const badge = $('connectionStatus');
                    badge.className = 'status-badge ' + (state.current === 'connected' ? 'connected' : 'connecting');
                    badge.querySelector('span').textContent = state.current.toUpperCase();
                });
                
                addLog('success', 'Echo client initialized successfully.');
            } catch (err) {
                addLog('error', 'Initialization Error', err.message);
            }
        };

        $('subscribeBtn').onclick = () => {
            if (!echo) {
                alert('Please connect to the WebSocket server first!');
                return;
            }

            if (currentChannel) {
                echo.leave(currentChannel.name);
                addLog('info', 'Leaving previous room channel: ' + currentChannel.name);
            }

            const userId = parseInt($('userId').value) || 0;
            const driverId = parseInt($('driverId').value) || 0;
            const channelName = `chat.${userId}_${driverId}`;

            addLog('info', `Attempting to join presence channel: ${channelName}`);
            
            currentChannel = echo.join(channelName);
            
            currentChannel.here((members) => {
                addLog('event-presence', '🟢 ROOM MEMBERS (CONNECTED)', members);
            })
            .joining((member) => {
                addLog('event-presence', '👤 MEMBER JOINED THE ROOM', member);
            })
            .leaving((member) => {
                addLog('event-presence', '🚩 MEMBER LEFT THE ROOM', member);
            })
            .listen('.message.sent', (data) => {
                addLog('event-chat', '💬 REAL-TIME MESSAGE RECEIVED', data);
            })
            .listen('.messages.seen', (data) => {
                addLog('event-seen', '👀 READ RECEIPT RECEIVED', data);
            })
            .listenForWhisper('typing', (e) => {
                addLog('event-presence', e.isTyping ? `⌨️ User ID ${e.userId} is typing...` : `🛑 User ID ${e.userId} stopped typing`, e);
            });
        };

        $('typingToggle').onchange = (e) => {
            if (!currentChannel) {
                alert('Join a channel first to simulate typing whispers!');
                e.target.checked = false;
                return;
            }

            const selfRole = $('selfRole').value;
            const selfId = selfRole === 'user' ? parseInt($('userId').value) : parseInt($('driverId').value);

            currentChannel.whisper('typing', {
                isTyping: e.target.checked,
                userId: selfId
            });
            
            addLog('info', e.target.checked ? 'Whispering typing state: true' : 'Whispering typing state: false');
        };

        $('leaveBtn').onclick = () => {
            if (currentChannel) {
                echo.leave(currentChannel.name);
                addLog('error', 'Left presence room: ' + currentChannel.name);
                currentChannel = null;
                $('typingToggle').checked = false;
            } else {
                alert('You are not subscribed to any channel.');
            }
        };

        const getApiHeaders = () => {
            const token = $('authToken').value.trim();
            return {
                'Content-Type': 'application/json',
                'Accept': 'application/json',
                'Authorization': token.startsWith('Bearer ') ? token : 'Bearer ' + token
            };
        };

        $('sendBtn').onclick = async () => {
            const selfRole = $('selfRole').value;
            const receiverId = selfRole === 'user' ? parseInt($('driverId').value) : parseInt($('userId').value);
            const message = $('testMessage').value;
            
            addLog('info', `Calling Send API (Receiver ID: ${receiverId})...`);
            
            try {
                const response = await fetch('/api/chat/user-driver/send', {
                    method: 'POST',
                    headers: getApiHeaders(),
                    body: JSON.stringify({
                        receiver_id: receiverId,
                        message: message
                    })
                });
                
                const result = await response.json();
                addLog(response.ok ? 'success' : 'error', 'POST /send API Result', result);
            } catch (err) {
                addLog('error', 'HTTP Request Failed', err.message);
            }
        };

        $('readBtn').onclick = async () => {
            const selfRole = $('selfRole').value;
            const receiverId = selfRole === 'user' ? parseInt($('driverId').value) : parseInt($('userId').value);
            
            addLog('info', `Calling Read API (Receiver ID: ${receiverId})...`);
            
            try {
                const response = await fetch('/api/chat/user-driver/read', {
                    method: 'POST',
                    headers: getApiHeaders(),
                    body: JSON.stringify({
                        receiver_id: receiverId
                    })
                });
                
                const result = await response.json();
                addLog(response.ok ? 'success' : 'error', 'POST /read API Result', result);
            } catch (err) {
                addLog('error', 'HTTP Request Failed', err.message);
            }
        };

        $('historyBtn').onclick = async () => {
            const selfRole = $('selfRole').value;
            const receiverId = selfRole === 'user' ? parseInt($('driverId').value) : parseInt($('userId').value);
            
            addLog('info', `Calling Get History API (Receiver ID: ${receiverId})...`);
            
            try {
                const response = await fetch(`/api/chat/user-driver/messages?receiver_id=${receiverId}`, {
                    method: 'GET',
                    headers: getApiHeaders()
                });
                
                const result = await response.json();
                addLog(response.ok ? 'success' : 'error', 'GET /messages API Result', result);
            } catch (err) {
                addLog('error', 'HTTP Request Failed', err.message);
            }
        };

        $('clearLogs').onclick = () => {
            lContainer.innerHTML = '';
        };
    </script>
</body>
</html>
